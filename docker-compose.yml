services:
  app:
    build: .
    # Published only on loopback: reachable at localhost:8000 on the host (handy for
    # local testing), but NOT exposed to the public internet. In production, traffic
    # reaches the app through Caddy over the internal Docker network (app:8000).
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - shareit_data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # persists issued TLS certs across restarts (avoid re-issuing)
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  shareit_data:
  caddy_data:
  caddy_config:
