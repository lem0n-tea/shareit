<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shareit{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root { --bg:#0f1115; --panel:#191c22; --fg:#e6e8eb; --muted:#9aa3ad; --accent:#4f8cff; --err:#ff6b6b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid #262a31; }
    header h1 { font-size:1.2rem; margin:0; }
    a { color:var(--accent); }
    main { max-width:900px; margin:0 auto; padding:24px 20px; }
    .center { min-height:90vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
    form.login { display:flex; flex-direction:column; gap:12px; width:260px; }
    input, button { padding:10px 12px; border-radius:8px; border:1px solid #2b303a; font-size:1rem; }
    input { background:var(--panel); color:var(--fg); }
    button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
    .error { color:var(--err); }
    .muted { color:var(--muted); }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid #262a31; }
    th { color:var(--muted); font-weight:600; user-select:none; cursor:pointer; }
    th.sorted { color:var(--fg); }
    /* Every header reserves the arrow's width; only the sorted one is visible, so
       switching sort columns doesn't resize anything. */
    th .arrow { font-size:0.75em; margin-left:3px; visibility:hidden; }
    th.sorted .arrow { visibility:visible; }
    tbody tr:hover { background:#20242b; }
    .ftype { margin-right:8px; }
    .upload { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
    td.actions { text-align:right; width:1%; white-space:nowrap; }
    .kebab { background:none; border:none; color:var(--muted); cursor:pointer; font-size:1.3rem; line-height:1; padding:0 6px; }
    .kebab:hover { color:var(--fg); }
    .menu { position:fixed; background:var(--panel); border:1px solid #2b303a; border-radius:8px; min-width:130px; z-index:50; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.45); }
    .menu[hidden] { display:none; }
    .menu a, .menu button { display:block; width:100%; text-align:left; padding:9px 14px; background:none; border:none; color:var(--fg); cursor:pointer; font:inherit; text-decoration:none; }
    .menu a:hover, .menu button:hover { background:#20242b; }
    #upload-error { min-height:1.2em; margin-bottom:8px; }
    #upload-progress { width:100%; height:8px; margin-top:8px; border:none; border-radius:4px; background:#262a31; }
    #upload-progress::-webkit-progress-bar { background:#262a31; border-radius:4px; }
    #upload-progress::-webkit-progress-value { background:var(--accent); border-radius:4px; }
    #upload-progress::-moz-progress-bar { background:var(--accent); border-radius:4px; }
    .storage { margin:4px 0 16px; }
    .storage-track { background:#262a31; border-radius:6px; height:10px; overflow:hidden; }
    .storage-fill { background:var(--accent); height:100%; transition:width .3s; }
    .storage-text { color:var(--muted); font-size:0.85rem; margin-top:4px; }
    .top-bar { display:flex; gap:16px; align-items:flex-start; margin-bottom:8px; }
    .top-bar .upload { margin:0; }
    .panel-clip { flex:1; min-width:0; }
    .panel-upload { flex:0 0 auto; }
    .panel-label { display:block; font-size:0.78rem; color:var(--muted); letter-spacing:0.04em; margin-bottom:6px; }
    .clip { display:flex; gap:10px; align-items:center; min-width:0; }
    .clip-box { flex:1; min-width:0; display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid #2b303a; border-radius:8px; padding:10px 8px 10px 12px; }
    .clip-text { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted); user-select:none; }
    .clip .copy { background:none; border:none; color:var(--muted); cursor:pointer; padding:0 4px; font-size:1.05rem; line-height:1; }
    .clip .copy:hover { color:var(--fg); }
    .table-wrap { overflow-x:auto; }           /* fallback: scroll if still too wide */
    @media (max-width:600px) {
      main { padding:16px; }
      header { padding:12px 16px; }
      header h1 { font-size:1.05rem; }
      .top-bar { flex-direction:column; }
      .panel-upload, .panel-clip { width:100%; min-width:0; }
      .upload input[type=file] { flex:1; min-width:0; }

      /* Turn the table into stacked cards -- no horizontal scroll on phones. */
      .table-wrap { overflow:visible; }
      #files thead { display:none; }
      #files, #files tbody, #files tr, #files td { display:block; }
      #files tr { position:relative; border:1px solid #262a31; border-radius:10px;
                  padding:10px 44px 10px 12px; margin-bottom:8px; }
      #files tr:hover { background:transparent; }
      #files td { border:none; padding:0; }
      /* Name line: prominent, single line, ellipsis if long. */
      #files td:first-child { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* Meta line: type · size · date, muted, on one row below the name. */
      #files td.col-type, #files td[data-size], #files td[data-ts] {
        display:inline; color:var(--muted); font-size:0.85rem;
      }
      #files td[data-size]::before, #files td[data-ts]::before { content:" · "; }
      /* Kebab floats at the card's top-right. */
      #files td.actions { position:absolute; top:6px; right:6px; width:auto; padding:0; }
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
