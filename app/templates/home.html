{% extends "base.html" %}
{% block title %}Your files — Shareit{% endblock %}
{% block content %}
<header>
  <h1>Shareit</h1>
  <a href="/logout">Log out</a>
</header>
<main>
  <form class="upload"
        hx-post="/upload"
        hx-target="#files tbody"
        hx-swap="afterbegin"
        hx-encoding="multipart/form-data"
        hx-on::before-request="document.getElementById('upload-error').innerHTML=''"
        hx-on::after-request="this.reset()">
    <input type="file" name="upload" required>
    <button type="submit">Upload</button>
  </form>
  <div id="upload-error" class="error"></div>

  <div id="storage" hx-get="/usage" hx-trigger="load, filesChanged from:body"></div>

  <table id="files">
    <thead>
      <tr>
        <th>Name <span class="arrow">▲</span></th>
        <th>Type <span class="arrow">▲</span></th>
        <th>Size <span class="arrow">▲</span></th>
        <th>Uploaded <span class="arrow">▲</span></th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for file in files %}{% include "_row.html" %}{% endfor %}
    </tbody>
  </table>
</main>

<script>
  // Minimal client-side column sort with an active-column highlight + direction arrow.
  // Numeric columns use data-size (bytes) and dates use data-ts (ISO string, which
  // sorts chronologically), so they order correctly rather than as display text.
  const headers = document.querySelectorAll('#files thead th');
  const dir = {};  // column index -> ascending? (persists per column)

  headers.forEach((th, idx) => {
    if (idx >= 4) return;            // skip the actions column
    th.addEventListener('click', () => {
      const asc = (dir[idx] = !dir[idx]);   // first click: !undefined === true (ascending)

      const tbody = document.querySelector('#files tbody');
      const rows = Array.from(tbody.querySelectorAll('tr'));
      rows.sort((a, b) => {
        const ca = a.children[idx], cb = b.children[idx];
        const numeric = ca.dataset.size !== undefined;
        let va = ca.dataset.size ?? ca.dataset.ts ?? ca.textContent.trim().toLowerCase();
        let vb = cb.dataset.size ?? cb.dataset.ts ?? cb.textContent.trim().toLowerCase();
        if (numeric) { va = +va; vb = +vb; }
        return (va < vb ? -1 : va > vb ? 1 : 0) * (asc ? 1 : -1);
      });
      rows.forEach(r => tbody.appendChild(r));

      // Highlight this column. CSS hides the other columns' arrows, but they keep
      // their reserved width, so nothing resizes when the sort column changes.
      headers.forEach(h => h.classList.remove('sorted'));
      th.classList.add('sorted');
      th.querySelector('.arrow').textContent = asc ? '▲' : '▼';
    });
  });
</script>
{% endblock %}
