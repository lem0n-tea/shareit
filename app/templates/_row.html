<tr>
  <td>{{ file.name }}{% if file.extension %}.{{ file.extension }}{% endif %}</td>
  <td>{{ file.extension or "—" }}</td>
  <td data-size="{{ file.size }}">{{ file.size | filesizeformat }}</td>
  <td data-ts="{{ file.uploaded_at.isoformat() }}">{{ file.uploaded_at.strftime("%Y-%m-%d %H:%M") }}</td>
  <td>
    <a href="/files/{{ file.id }}/download">Download</a>
    <button hx-delete="/delete/{{ file.id }}" hx-target="closest tr" hx-swap="outerHTML"
            hx-confirm="Delete this file?">Delete</button>
  </td>
</tr>
