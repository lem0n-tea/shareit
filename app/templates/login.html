{% extends "base.html" %}
{% block title %}Log in — Shareit{% endblock %}
{% block content %}
<main class="center">
  <h1>Share<span class="brand-accent">it</span></h1>
  <form class="login" method="post" action="/login">
    <input type="password" name="password" placeholder="Password" required minlength="8" autofocus>
    <button type="submit">Log in</button>
  </form>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
</main>
{% endblock %}
