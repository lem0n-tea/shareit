<div id="clipboard" class="clip">
  <div class="clip-box">
    <span class="clip-text">{{ clipboard.snippet if clipboard and clipboard.snippet else "Nothing shared yet" }}</span>
    <button type="button" class="copy" aria-label="Copy" title="Copy" data-copy="{{ clipboard.snippet if clipboard and clipboard.snippet else '' }}">📋</button>
  </div>
  <button type="button" class="share">Share</button>
</div>
