{% extends "base.html" %}
{% block title %}Register — Shareit{% endblock %}
{% block content %}
<main class="center">
  <h1>Share<span class="brand-accent">it</span></h1>
  <form class="login" method="post" action="/register">
    <input type="password" name="password" placeholder="Password" required minlength="8" autofocus>
    <input type="password" name="confirm" placeholder="Confirm password" required minlength="8">
    <button type="submit">Register</button>
  </form>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
</main>
{% endblock %}
